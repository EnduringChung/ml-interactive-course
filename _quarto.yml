project:
  type: website

# All pages are pure client-side documents: no local Python/R execution
# happens at render time. {pyodide} / {webr} cells run in the reader's
# browser via the quarto-live extension, so the lightweight markdown
# engine is all we need.
engine: markdown

website:
  title: "ML, Statistics & LLM — Interactive Course"
  description: "An interactive machine-learning, statistics and LLM course that runs entirely in your browser (iPad-ready)."
  site-url: https://enduringchung.github.io/ml-interactive-course/
  repo-url: https://github.com/EnduringChung/ml-interactive-course
  repo-actions: [edit, issue]
  page-navigation: true
  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        href: index.qmd
    right:
      - icon: github
        href: https://github.com/EnduringChung/ml-interactive-course
  sidebar:
    - id: course
      title: "Course"
      style: floating
      align: left
      collapse-level: 1
      contents:
        - index.qmd
        - section: "Part 0 — Python & Data Foundations"
          contents:
            - part-00-python-foundations/00-1-python-basics.qmd
            - part-00-python-foundations/00-2-numpy.qmd
            - part-00-python-foundations/00-3-pandas.qmd
            - part-00-python-foundations/00-4-visualization-eda.qmd
            - part-00-python-foundations/00-5-data-splitting.qmd
        - section: "Part 1 — Statistics Bridge for ML"
          contents:
            - part-01-statistics-bridge/01-1-descriptive-statistics.qmd
            - part-01-statistics-bridge/01-2-relationships.qmd
            - part-01-statistics-bridge/01-3-probability-essentials.qmd
            - part-01-statistics-bridge/01-4-statistical-inference.qmd
            - part-01-statistics-bridge/01-5-resampling-intuition.qmd
        - section: "Part 2 — Linear Regression & Prediction"
          contents:
            - part-02-linear-regression/02-1-regression-setup.qmd
            - part-02-linear-regression/02-2-simple-linear-regression.qmd
            - part-02-linear-regression/02-3-accuracy-of-coefficients.qmd
            - part-02-linear-regression/02-4-accuracy-of-model.qmd
            - part-02-linear-regression/02-5-multiple-linear-regression.qmd
            - part-02-linear-regression/02-6-categorical-predictors.qmd
            - part-02-linear-regression/02-7-interaction-terms.qmd
            - part-02-linear-regression/02-8-nonlinear-transformations.qmd
            - part-02-linear-regression/02-9-knn-regression.qmd
            - part-02-linear-regression/02-10-regression-assumptions.qmd
        - section: "Part 3 — Classification & GLMs"
          contents:
            - part-03-classification-glm/03-1-classification-fundamentals.qmd
            - part-03-classification-glm/03-1-5-auprc.qmd
            - part-03-classification-glm/03-2-why-not-linear-regression.qmd
            - part-03-classification-glm/03-3-logistic-regression.qmd
            - part-03-classification-glm/03-4-generative-classifiers.qmd
            - part-03-classification-glm/03-5-knn-classification.qmd
            - part-03-classification-glm/03-6-generalized-linear-models.qmd
            - part-03-classification-glm/03-7-model-comparison.qmd
        - section: "Part 4 — Validation & Model Selection"
          contents:
            - part-04-validation-model-selection/04-1-generalization-problem.qmd
            - part-04-validation-model-selection/04-2-validation-set.qmd
            - part-04-validation-model-selection/04-3-cross-validation.qmd
            - part-04-validation-model-selection/04-4-bias-variance.qmd
            - part-04-validation-model-selection/04-5-bootstrap.qmd
            - part-04-validation-model-selection/04-6-hyperparameter-tuning.qmd
        - section: "Part 5 — Regularization & High Dimensions"
          contents:
            - part-05-regularization-high-dimensions/05-1-feature-selection.qmd
            - part-05-regularization-high-dimensions/05-2-ridge-regression.qmd
            - part-05-regularization-high-dimensions/05-3-lasso-regression.qmd
            - part-05-regularization-high-dimensions/05-4-elastic-net.qmd
            - part-05-regularization-high-dimensions/05-5-pcr-pls.qmd
            - part-05-regularization-high-dimensions/05-6-high-dimensional.qmd

format:
  live-html:
    theme: cosmo
    toc: true
    toc-depth: 2
    number-sections: false
    css: assets/styles.css
    crossref:
      chapters: true
