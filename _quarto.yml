project:
  type: website
  render:
    - index.qmd
    - part-*/
    - "!notebooks/*"

# All pages are pure client-side documents: no local Python/R execution
# happens at render time. {pyodide} / {webr} cells run in the reader's
# browser via the quarto-live extension, so the lightweight markdown
# engine is all we need.
engine: markdown

website:
  title: "ML, Statistics & LLM — Interactive Course"
  description: "An interactive machine-learning, statistics and LLM course that runs entirely in your browser (iPad-ready)."
  site-url: https://enduringchung.github.io/ml-interactive-course/
  repo-url: https://github.com/EnduringChung/ml-interactive-course
  repo-actions: [edit, issue]
  page-navigation: true
  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        href: index.qmd
    right:
      - icon: github
        href: https://github.com/EnduringChung/ml-interactive-course
